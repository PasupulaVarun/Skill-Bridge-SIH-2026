
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================
           BODY
        ========================================= */

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            background: #061a1b;

            color: white;
        }


        /* =========================================
           VIDEO BACKGROUND
        ========================================= */

        #bg-video {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            min-width: 100%;
            min-height: 100%;

            object-fit: cover;

            transform: translate(-50%, -50%);

            z-index: -10;
        }


        /* =========================================
           DARK VIDEO OVERLAY
        ========================================= */

        .video-overlay {
            position: fixed;

            inset: 0;

            z-index: -9;

            background:
                linear-gradient(
                    135deg,
                    rgba(2, 20, 21, 0.70),
                    rgba(0, 45, 43, 0.48),
                    rgba(2, 20, 21, 0.78)
                );
        }


        /* =========================================
           ANIMATED GRADIENT
        ========================================= */

        .animated-gradient {
            position: fixed;

            inset: 0;

            z-index: -8;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(13, 148, 136, 0.30),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(20, 184, 166, 0.20),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(6, 78, 59, 0.25),
                    transparent 40%
                );

            animation: gradientMove 12s ease-in-out infinite alternate;
        }


        @keyframes gradientMove {

            0% {
                transform: scale(1);
                opacity: 0.75;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }

            100% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 420px;

            padding: 40px;

            border-radius: 26px;

            /* Glass effect */

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.16),
                    rgba(255, 255, 255, 0.07)
                );

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.40),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);

            position: relative;

            overflow: hidden;

            animation: cardAppear 0.8s ease-out;
        }


        /* Glass highlight */

        .login-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.7),
                    transparent
                );
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            text-align: center;

            margin-bottom: 30px;
        }


        .logo-icon {

            width: 58px;
            height: 58px;

            margin: 0 auto 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #0d766d,
                    #14b8a6
                );

            color: white;

            font-weight: bold;

            font-size: 18px;

            box-shadow:
                0 10px 30px rgba(20, 184, 166, 0.30);
        }


        .logo h1 {

            font-size: 27px;

            color: white;

            letter-spacing: -0.5px;
        }


        .logo span {
            color: #5eead4;
        }


        .logo p {

            margin-top: 7px;

            color: rgba(255,255,255,0.68);

            font-size: 13px;
        }


        /* =========================================
           HEADINGS
        ========================================= */

        h2 {

            text-align: center;

            margin-bottom: 8px;

            color: white;

            font-size: 24px;
        }


        .subtitle {

            text-align: center;

            color: rgba(255,255,255,0.65);

            font-size: 14px;

            margin-bottom: 25px;
        }


        /* =========================================
           LABELS
        ========================================= */

        label {

            display: block;

            margin-bottom: 7px;

            color: rgba(255,255,255,0.85);

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================================
           INPUTS
        ========================================= */

        input,
        select {

            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.20);

            outline: none;

            font-size: 14px;

            color: white;

            background: rgba(255,255,255,0.09);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            transition:
                border 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        input::placeholder {

            color: rgba(255,255,255,0.48);
        }


        input:focus,
        select:focus {

            border-color: #5eead4;

            background: rgba(255,255,255,0.13);

            box-shadow:
                0 0 0 3px rgba(45,212,191,0.12);
        }


        /* Dropdown options */

        select option {

            background: #123333;

            color: white;
        }


        /* =========================================
           PASSWORD
        ========================================= */

        .password-box {

            position: relative;
        }


        .password-box input {

            padding-right: 65px;
        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 11px;

            border: none;

            background: transparent;

            color: #5eead4;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            background: rgba(34,197,94,0.10);

            border: 1px solid rgba(74,222,128,0.18);

            color: #86efac;

            text-align: center;


            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(13,118,109,0.30);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 16px 35px rgba(20,184,166,0.40);
        }


        .login-btn:active {

            transform: translateY(0);
        }





        /* =========================================
           ERROR
        ========================================= */

        .error {

            margin-top: 12px;

            color: #fca5a5;

            text-align: center;

            font-size: 13px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }


            /*
               Hide video on mobile.
               This improves performance and gives
               us a clean gradient fallback.
            */

            #bg-video {

                display: none;
            }


            .video-overlay {

                background:
                    linear-gradient(
                        135deg,
                        #031c1d,
                        #073b3a,
                        #061a1b
                    );
            }


            .animated-gradient {

                animation: none;

                background:
                    radial-gradient(
                        circle at 10% 10%,
                        rgba(13,148,136,0.30),
                        transparent 40%
                    ),

                    radial-gradient(
                        circle at 90% 90%,
                        rgba(20,184,166,0.18),
                        transparent 40%
                    );
            }


            .login-card {

                width: 100%;

                max-width: 420px;

                padding: 32px 24px;

                border-radius: 22px;

                backdrop-filter: blur(18px);

                -webkit-backdrop-filter: blur(18px);
            }
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 400px) {

            body {

                padding: 15px;
            }


            .login-card {

                padding: 28px 20px;
            }


            .logo h1 {

                font-size: 24px;
            }


            h2 {

                font-size: 22px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .animated-gradient,
            .login-card {

                animation: none;
            }

            .login-btn {

                transition: none;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         VIDEO BACKGROUND
    ========================================= -->

    <video
        autoplay
        muted
        loop
        playsinline
        id="bg-video">

        <source src="bg.mp4" type="video/mp4">

    </video>


    <!-- Background overlays -->

    <div class="video-overlay"></div>

    <div class="animated-gradient"></div>


    <!-- =========================================
         LOGIN CARD
    ========================================= -->

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                SB
            </div>

            <h1>
                Skill<span>Bridge</span>
            </h1>

            <p>
                Academia–Industry Collaboration Portal
            </p>

        </div>


        <!-- TITLE -->

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Sign in to access your portal
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword">

                    Show

                </button>

            </div>


            <!-- ROLE -->

            <label for="role">
                Login As
            </label>

            <select id="role" required>

                <option value="">
                    Select your role
                </option>

                <option value="student">
                    Student
                </option>

                <option value="industry">
                    Industry
                </option>

                <option value="institution">
                    Institution
                </option>

            </select>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                Sign In →

            </button>


            <!-- ERROR -->

            <p
                id="errorMessage"
                class="error">
            </p>


        </form>


        <!-- VERIFIED -->




    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        const loginForm =
            document.getElementById("loginForm");


        const showPassword =
            document.getElementById("showPassword");


        const password =
            document.getElementById("password");


        const errorMessage =
            document.getElementById("errorMessage");


        /* =========================================
           SHOW / HIDE PASSWORD
        ========================================= */

        showPassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    showPassword.textContent = "Hide";

                } else {

                    password.type = "password";

                    showPassword.textContent = "Show";
                }

            }
        );


        /* =========================================
           LOGIN
        ========================================= */

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                const passwordValue =
                    document
                    .getElementById("password")
                    .value
                    .trim();


                const role =
                    document
                    .getElementById("role")
                    .value;


                /* Validate */

                if (
                    !email ||
                    !passwordValue ||
                    !role
                ) {

                    errorMessage.textContent =
                        "Please complete all fields.";

                    return;
                }


                /* Clear previous session */

                localStorage.clear();


                /* Save login information */

                localStorage.setItem(
                    "userEmail",
                    email
                );


                localStorage.setItem(
                    "userRole",
                    role
                );


                /*
                    Always go to
                    basic-info.html first.
                */

                window.location.replace(
                    "basic-info.html"
                );

            }
        );

    </script>


</body>

</html>
